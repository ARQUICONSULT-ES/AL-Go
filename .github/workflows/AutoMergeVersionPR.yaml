name: ' Auto-merge version number PR'

# Approves and merges the pull request that AL-Go opens to increment the version
# number (branch increment-version-number/*), no matter who triggered the release.
# It uses the ARQ Release Bot GitHub App, which is a bypass actor in the main+dev ruleset.
#
# Requires:
#   - variable RELEASE_BOT_APP_ID
#   - secret   RELEASE_BOT_PRIVATE_KEY

on:
  workflow_run:
    # AL-Go names some workflows with a leading space and some without: list both.
    workflows: [' Create release', 'Create release', ' Increment Version Number', 'Increment Version Number']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-merge-version-pr
  cancel-in-progress: false

jobs:
  AutoMerge:
    # Runs even if the release failed in a later step: the PR may already exist.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Approve and merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          prs=$(gh pr list -R "$REPO" --base "$BASE" --state open --limit 100 \
            --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository == false and (.headRefName | startswith("increment-version-number/"))) | .number')

          if [ -z "$prs" ]; then
            echo "No version number pull request to merge."
            exit 0
          fi

          for pr in $prs; do
            # Only version files may change: anything else is left for a human review.
            other=$(gh api "repos/$REPO/pulls/$pr/files" --paginate --jq '.[].filename' \
              | grep -vE '(^|/)(\.AL-Go/settings\.json|app\.json)$|^\.github/AL-Go-Settings\.json$' || true)
            if [ -n "$other" ]; then
              echo "::warning::PR #$pr changes other files and was not merged: $(echo $other)"
              continue
            fi

            branch=$(gh pr view "$pr" -R "$REPO" --json headRefName --jq .headRefName)
            gh pr review "$pr" -R "$REPO" --approve --body "Version number increment approved automatically by ARQ Release Bot."
            gh pr merge "$pr" -R "$REPO" --squash --admin
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" || true
            echo "Merged PR #$pr ($branch)."
          done
