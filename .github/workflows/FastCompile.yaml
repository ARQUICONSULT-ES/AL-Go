name: 'Fast Compile'
run-name: "Fast Compile [${{ github.ref_name }}]"

on:
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: powershell

env:
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}
  OUTPUT_PATH: '.output'
jobs:
  FastCompile:
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Read settings
        uses: ARQUICONSULT-ES/AL-Go-Actions/ReadSettings@v6.3
        with:
          shell: powershell

      - name: Read secrets
        id: ReadSecrets
        uses: ARQUICONSULT-ES/AL-Go-Actions/ReadSecrets@v6.3
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'appDependencySecrets,GHTOKENWORKFLOW'

      - name: Determine Project Folder
        id: determineProjectFolder
        run: |
          $ErrorActionPreference = "Stop"
          $settingsFiles = @(".AL-Go\settings.json", ".github\AL-Go-Settings.json")
          $appFolders = @(".")
          foreach ($sf in $settingsFiles) {
            if (Test-Path $sf) {
              $settings = Get-Content -Raw -Path $sf | ConvertFrom-Json
              if ($settings.appFolders -and $settings.appFolders.Count -gt 0) {
                $appFolders = $settings.appFolders
                break
              }
            }
          }
          $projectFolder = $appFolders[0]
          Write-Host "[INFO] Project folder: $projectFolder"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "projectFolder=$projectFolder"

      - name: Install/Update BcContainerHelper
        run: |
          $ErrorActionPreference = "Stop"
          $module = Get-Module -ListAvailable -Name BcContainerHelper | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $module) {
            Write-Host "Installing BcContainerHelper..."
            Install-Module BcContainerHelper -Force -SkipPublisherCheck -AllowClobber
          } else {
            Write-Host "BcContainerHelper already installed: $($module.Version)"
            Write-Host "Updating BcContainerHelper to latest..."
            Update-Module BcContainerHelper -Force
          }
          Import-Module BcContainerHelper
          Write-Host "BcContainerHelper ready."

      - name: Resolve Compiler Folder
        id: compiler
        env:
          PROJECT_FOLDER: ${{ steps.determineProjectFolder.outputs.projectFolder }}
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module BcContainerHelper

          # Leer todas las pistas de version del app.json para determinar la BC version objetivo
          $manifest = Get-Content -Raw -Path "$env:PROJECT_FOLDER\app.json" | ConvertFrom-Json
          $versionHints = @()

          # application y platform indican directamente la version objetivo de BC
          foreach ($field in @('application', 'platform')) {
            if ($manifest.$field) {
              $major = [int]($manifest.$field -split '\.')[0]
              if ($major -gt 0) {
                $versionHints += $major
                Write-Host "[INFO] Version hint from app.json.$field : $major"
              }
            }
          }

          # runtime indica la version del lenguaje AL requerida.
          # Cada major version de BC distribuye un AL compiler con un runtime especifico.
          # La correlacion empirica de Microsoft (BC 23->runtime 12, BC 24->13, BC 25->14, BC 26->15...)
          # permite estimar: BC version minima = runtime major + 11
          if ($manifest.runtime) {
            $runtimeMajor = [int]($manifest.runtime -split '\.')[0]
            $derivedFromRuntime = $runtimeMajor + 11
            $versionHints += $derivedFromRuntime
            Write-Host "[INFO] Version hint from app.json.runtime '$($manifest.runtime)' -> BC $derivedFromRuntime"
          }

          if ($versionHints.Count -eq 0) {
            $bcVersion = 25
            Write-Host "[WARN] No version info found in app.json, defaulting to BC $bcVersion"
          } else {
            # Usar la version mas alta de todas las pistas para asegurar compatibilidad
            $bcVersion = $versionHints | Sort-Object -Descending | Select-Object -First 1
            Write-Host "[INFO] Selected highest BC version from all hints: $bcVersion"
          }
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "bcVersion=$bcVersion"

          # Crear compiler folder (reutiliza artifact cacheado si existe)
          $compilerBase = "C:\ProgramData\BcContainerHelper\compiler"
          $artifactUrl = Get-BCArtifactUrl -type Sandbox -country es -version $bcVersion -select Latest
          if (-not $artifactUrl) {
            throw "Could not determine artifact URL for BC $bcVersion"
          }
          Write-Host "[INFO] Artifact URL: $artifactUrl"
          Write-Host "[INFO] Creating compiler folder for BC $bcVersion..."
          New-BcCompilerFolder -artifactUrl $artifactUrl

          $compilerFolder = Get-ChildItem -Path $compilerBase -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Write-Host "[OK] Compiler folder: $($compilerFolder.FullName)"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "path=$($compilerFolder.FullName)"

          # Limpiar compiler folders antiguos (mantener solo los 2 mas recientes)
          $allFolders = Get-ChildItem -Path $compilerBase -Directory | Sort-Object LastWriteTime -Descending
          if ($allFolders.Count -gt 2) {
            $allFolders | Select-Object -Skip 2 | ForEach-Object {
              Write-Host "[CLEANUP] Removing old compiler folder: $($_.FullName)"
              Remove-Item -Path $_.FullName -Recurse -Force
            }
          }

      - name: Download Project Dependencies
        id: DownloadProjectDependencies
        uses: ARQUICONSULT-ES/AL-Go-Actions/DownloadProjectDependencies@v6.3
        env:
          Secrets: '${{ steps.ReadSecrets.outputs.Secrets }}'
        with:
          shell: powershell
          project: ${{ steps.determineProjectFolder.outputs.projectFolder }}
          buildMode: Default
          projectsDependenciesJson: '{}'
          baselineWorkflowRunId: '0'

      - name: Copy Downloaded Dependencies to .alpackages
        env:
          PROJECT_FOLDER: ${{ steps.determineProjectFolder.outputs.projectFolder }}
        run: |
          $ErrorActionPreference = "Stop"
          $depsPath = ".dependencies"
          $alpackages = Join-Path $env:PROJECT_FOLDER ".alpackages"
          if (-not (Test-Path $alpackages)) {
            New-Item -ItemType Directory -Path $alpackages -Force | Out-Null
          }
          if (Test-Path $depsPath) {
            # Extraer primero todos los ZIP descargados por AL-Go
            $zips = Get-ChildItem -Path $depsPath -Recurse -Filter "*.zip"
            foreach ($zip in $zips) {
              $extractDir = Join-Path $depsPath "extracted_$([Guid]::NewGuid().ToString())"
              New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
              Write-Host "[EXTRACT] $($zip.FullName) -> $extractDir"
              Expand-Archive -Path $zip.FullName -DestinationPath $extractDir -Force
            }
            $apps = Get-ChildItem -Path $depsPath -Recurse -Filter "*.app"
            foreach ($app in $apps) {
              $dest = Join-Path $alpackages $app.Name
              Copy-Item -Path $app.FullName -Destination $dest -Force
              Write-Host "[OK] Copied $($app.FullName) -> $dest"
            }
            Write-Host "[INFO] Copied $($apps.Count) dependency app(s) to .alpackages/"
          } else {
            Write-Host "[INFO] No .dependencies folder found"
          }

      - name: Copy Local Dependencies
        env:
          COMPILER_FOLDER: ${{ steps.compiler.outputs.path }}
          PROJECT_FOLDER: ${{ steps.determineProjectFolder.outputs.projectFolder }}
        run: |
          $ErrorActionPreference = "Stop"
          $alpackages = Join-Path $env:PROJECT_FOLDER ".alpackages"
          if (-not (Test-Path $alpackages)) {
            New-Item -ItemType Directory -Path $alpackages -Force | Out-Null
          }

          $manifest = Get-Content -Raw -Path "$env:PROJECT_FOLDER\app.json" | ConvertFrom-Json

          function Get-Version([string]$VersionString) {
            if ([string]::IsNullOrWhiteSpace($VersionString)) { return [System.Version]"0.0.0.0" }
            return [System.Version]$VersionString
          }

          function Get-AppManifestInfo([string]$AppFile, [string]$AltoolPath) {
            $output = (& $AltoolPath "GetPackageManifest" $AppFile 2>&1) | Out-String
            if ($LASTEXITCODE -ne 0) { throw "altool GetPackageManifest failed with exit code $LASTEXITCODE`n$output" }
            try {
              $json = $output | ConvertFrom-Json
            } catch {
              throw "Could not parse altool output as JSON`n$output"
            }
            if (-not $json.id -or -not $json.name -or -not $json.version) { throw "Missing required fields in manifest JSON`n$output" }
            return @{
              Id = $json.id
              Name = $json.name
              Publisher = $json.publisher
              Version = Get-Version $json.version
            }
          }

          $localDepsPath = "C:\CICD-External-Dependencies"
          $altool = Join-Path $env:COMPILER_FOLDER "compiler\extension\bin\win32\altool.exe"
          if (-not (Test-Path $altool)) {
            $altool = Join-Path $env:COMPILER_FOLDER "compiler\extension\bin\linux\altool"
          }

          if (Test-Path $localDepsPath) {
            Write-Host "[INFO] Scanning $localDepsPath (including subfolders) for valid .app files..."
            $apps = Get-ChildItem -Path $localDepsPath -Recurse -Filter "*.app"
            $copied = 0
            $skipped = 0
            foreach ($app in $apps) {
              # Leer manifiesto con altool (tambien valida el paquete; necesario para runtime packages)
              $appInfo = $null
              try {
                $appInfo = Get-AppManifestInfo $app.FullName $altool
              } catch {
                Write-Host "[SKIP] Could not read manifest for $($app.FullName): $_"
                $skipped++
                continue
              }

              $matchingDep = $manifest.dependencies | Where-Object {
                ($_.id -and $_.id -eq $appInfo.Id) -or ($_.name -and $_.name -eq $appInfo.Name)
              } | Select-Object -First 1

              if ($matchingDep) {
                $required = Get-Version $matchingDep.version
                if ($appInfo.Version -lt $required) {
                  Write-Host "[SKIP] Older version of '$($appInfo.Name)' ($($appInfo.Version) < $required): $($app.FullName)"
                  $skipped++
                  continue
                }
              }

              $dest = Join-Path $alpackages $app.Name
              Copy-Item -Path $app.FullName -Destination $dest -Force
              Write-Host "[OK] Copied valid app: $($app.Name) (version $($appInfo.Version))"
              $copied++
            }
            Write-Host "[INFO] Copied $copied app(s), skipped $skipped invalid file(s)"
          } else {
            Write-Host "[WARN] Local dependencies path not found: $localDepsPath"
          }

      - name: Prepare Dependencies
        env:
          COMPILER_FOLDER: ${{ steps.compiler.outputs.path }}
          PROJECT_FOLDER: ${{ steps.determineProjectFolder.outputs.projectFolder }}
        run: |
          $ErrorActionPreference = "Stop"
          $alpackages = Join-Path $env:PROJECT_FOLDER ".alpackages"
          if (-not (Test-Path $alpackages)) {
            New-Item -ItemType Directory -Path $alpackages -Force | Out-Null
          }
          
          $manifest = Get-Content -Raw -Path "$env:PROJECT_FOLDER\app.json" | ConvertFrom-Json

          $altool = Join-Path $env:COMPILER_FOLDER "compiler\extension\bin\win32\altool.exe"
          if (-not (Test-Path $altool)) {
            $altool = Join-Path $env:COMPILER_FOLDER "compiler\extension\bin\linux\altool"
          }

          function Get-Version([string]$VersionString) {
            if ([string]::IsNullOrWhiteSpace($VersionString)) { return [System.Version]"0.0.0.0" }
            return [System.Version]$VersionString
          }

          function Get-AppManifestInfo([string]$AppFile, [string]$AltoolPath) {
            $output = (& $AltoolPath "GetPackageManifest" $AppFile 2>&1) | Out-String
            if ($LASTEXITCODE -ne 0) { throw "altool GetPackageManifest failed with exit code $LASTEXITCODE`n$output" }
            try {
              $json = $output | ConvertFrom-Json
            } catch {
              throw "Could not parse altool output as JSON`n$output"
            }
            if (-not $json.id -or -not $json.name -or -not $json.version) { throw "Missing required fields in manifest JSON`n$output" }
            return @{
              Id = $json.id
              Name = $json.name
              Publisher = $json.publisher
              Version = Get-Version $json.version
            }
          }

          $allApps = Get-ChildItem -Path $alpackages -Filter "*.app" -ErrorAction SilentlyContinue
          Write-Host "[DEBUG] Files in .alpackages/:"
          if ($allApps) { $allApps | ForEach-Object { Write-Host "  - $($_.Name)" } } else { Write-Host "  (empty)" }

          $missingDeps = @()
          foreach ($dep in $manifest.dependencies) {
            $required = Get-Version $dep.version
            Write-Host "[DEP] Checking dependency '$($dep.name)' (id=$($dep.id)) required >= $required"

            $compatible = $null
            foreach ($app in $allApps) {
              try {
                $appInfo = Get-AppManifestInfo $app.FullName $altool
                $matchesDep = ($dep.id -and $dep.id -eq $appInfo.Id) -or ($dep.name -and $dep.name -eq $appInfo.Name)
                if (-not $matchesDep) { continue }
                Write-Host "[DEBUG] Candidate '$($app.Name)': name='$($appInfo.Name)', id='$($appInfo.Id)', version='$($appInfo.Version)'"
                if ($appInfo.Version -ge $required) {
                  $compatible = $app
                  Write-Host "[OK] Dependency '$($dep.name)' satisfied by $($app.Name) (version $($appInfo.Version) >= $required)"
                  break
                } else {
                  Write-Host "[WARN] Candidate '$($app.Name)' version $($appInfo.Version) is lower than required $required"
                }
              } catch {
                Write-Host "[WARN] Could not read manifest for $($app.Name): $_"
              }
            }
            if (-not $compatible) {
              $missingDeps += $dep.name
              Write-Host "::error::DEPENDENCY MISSING OR INCOMPATIBLE: '$($dep.name)' ($($dep.publisher)) required >= $required"
            }
          }
          
          if ($missingDeps.Count -gt 0) {
            Write-Host ""
            Write-Host "::error::Total missing or incompatible dependencies: $($missingDeps.Count)"
            Write-Host "Available files in .alpackages/:"
            Get-ChildItem -Path $alpackages -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  - $($_.Name)" }
            throw "Missing or incompatible dependencies: $($missingDeps -join ', ')"
          } else {
            Write-Host "[OK] All $($manifest.dependencies.Count) dependencies found in .alpackages/"
          }

      - name: Compile App
        id: compile
        env:
          PROJECT_FOLDER: ${{ steps.determineProjectFolder.outputs.projectFolder }}
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module BcContainerHelper
          
          # Inyectar temporalmente dependencias de Microsoft para CI/CD
          # (en VS Code contra un sandbox, el servidor las resuelve implicitamente)
          $appJsonPath = Join-Path (Get-Location).Path "$env:PROJECT_FOLDER\app.json"
          $appJsonBak = "$appJsonPath.bak"
          Copy-Item -Path $appJsonPath -Destination $appJsonBak -Force
          
          $manifest = Get-Content -Raw -Path $appJsonPath | ConvertFrom-Json
          $bcVersion = ($manifest.application -split '\.')[0] + ".0.0.0"
          if (-not $manifest.application) { $bcVersion = ($manifest.platform -split '\.')[0] + ".0.0.0" }
          
          # Nota: 'Application' no se inyecta porque la propiedad 'application' en app.json
          # ya crea esa dependencia implicitamente. Inyectarla explicitamente genera AL0703.
          $msDeps = @(
            @{ id = "63ca2fa4-4f03-4f2b-a480-172fef340d3f"; name = "System Application"; publisher = "Microsoft"; version = $bcVersion }
            @{ id = "437dbf0e-84ff-417a-965d-ed2bb9650972"; name = "Base Application"; publisher = "Microsoft"; version = $bcVersion }
          )
          
          $existingNames = $manifest.dependencies | ForEach-Object { $_.name }
          $newDeps = @()
          foreach ($msDep in $msDeps) {
            if ($existingNames -notcontains $msDep.name) {
              $newDeps += [ordered]@{ id = $msDep.id; name = $msDep.name; publisher = $msDep.publisher; version = $msDep.version }
            }
          }
          
          if ($newDeps.Count -gt 0) {
            Write-Host "[INFO] Injecting $($newDeps.Count) Microsoft dependencies for CI/CD compilation"
            $combinedDeps = $newDeps + $manifest.dependencies
            $manifest.dependencies = $combinedDeps
            $manifest | ConvertTo-Json -Depth 10 | Set-Content -Path $appJsonPath -Encoding UTF8
          }
          
          $compilerFolder = "${{ steps.compiler.outputs.path }}"
          $outputFolder = $env:OUTPUT_PATH
          
          if (-not (Test-Path $outputFolder)) {
            New-Item -ItemType Directory -Path $outputFolder -Force | Out-Null
          }
          
          Write-Host "Compiling with compiler folder: $compilerFolder"
          Write-Host "Output folder: $outputFolder"
          
          try {
            $resolvedOutput = (Resolve-Path $outputFolder).Path
            Write-Host "[DEBUG] Resolved output folder: $resolvedOutput"
            
            $appFile = Compile-AppWithBcCompilerFolder `
              -compilerFolder $compilerFolder `
              -appProjectFolder (Resolve-Path $env:PROJECT_FOLDER).Path `
              -appOutputFolder $resolvedOutput
            
            Write-Host "[DEBUG] Compile-AppWithBcCompilerFolder returned: $appFile"
            Write-Host "[DEBUG] Checking if file exists..."
            
            if (-not $appFile -or -not (Test-Path $appFile)) {
              Write-Host "::error::Compilation output not found at expected path: $appFile"
              Write-Host "[DEBUG] Listing contents of $resolvedOutput`:"
              Get-ChildItem -Path $resolvedOutput -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
              throw "Compilation failed: output .app file not found"
            }
            
            Write-Host "::notice::Successfully compiled: $appFile"
            $fileName = Split-Path $appFile -Leaf
            Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "appFile=$appFile"
            Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "appFileName=$fileName"
          } finally {
            # Restaurar app.json original
            if (Test-Path $appJsonBak) {
              Move-Item -Path $appJsonBak -Destination $appJsonPath -Force
              Write-Host "[INFO] Restored original app.json"
            }
          }

      - name: Package as ZIP
        id: package
        env:
          PROJECT_FOLDER: ${{ steps.determineProjectFolder.outputs.projectFolder }}
        run: |
          $ErrorActionPreference = "Stop"
          $outputPath = (Resolve-Path $env:OUTPUT_PATH).Path
          
          # Leer nombre y version desde app.json para el nombre del artifact
          $manifest = Get-Content -Raw -Path "$env:PROJECT_FOLDER\app.json" | ConvertFrom-Json
          $artifactName = "$($manifest.name)_$($manifest.version).zip"
          # Sanitizar nombre de artifact (quitar caracteres no validos para GitHub Actions)
          $artifactName = $artifactName -replace '[\\/:*?"<>|]', '_'
          
          $zipFile = Join-Path $outputPath $artifactName
          
          # Buscar el .app generado (la variable de salida puede fallar por codificacion)
          $appFile = Get-ChildItem -Path $outputPath -Filter "*.app" -File | Select-Object -First 1
          if (-not $appFile) {
            Write-Host "::error::No .app file found in $outputPath"
            Write-Host "Contents of $outputPath`:"
            Get-ChildItem -Path $outputPath -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "Compilation output not found"
          }
          
          Write-Host "[INFO] Packaging $($appFile.FullName) into $artifactName ..."
          Compress-Archive -Path $appFile.FullName -DestinationPath $zipFile -Force
          
          if (-not (Test-Path $zipFile)) {
            throw "ZIP file was not created at $zipFile"
          }
          
          Write-Host "::notice::ZIP ready: $zipFile"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "zipFile=$zipFile"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "artifactName=$artifactName"

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifactName }}
          path: ${{ steps.package.outputs.zipFile }}
          if-no-files-found: error

      - name: Summary
        run: |
          Write-Host "========================================"
          Write-Host "FAST COMPILE COMPLETE"
          Write-Host "========================================"
          Write-Host "Output: ${{ env.OUTPUT_PATH }}"
          Get-ChildItem -Path $env:OUTPUT_PATH | ForEach-Object {
            Write-Host "Artifact: $($_.Name) | Size: $([math]::Round($_.Length/1KB,2)) KB"
          }
